# Experiment 0: hypothesis check on a small dataset.
#
# Purpose: prove the whole pipeline runs end to end and produces real audio,
# on a 2013-clip / ~2 GB corpus, before spending money on the 100-hour set.
#
#   dataset: OmarAhmedSobhy/tts-egyption-dataset  (parquet, 2013 rows)
#
# Sized for a 6 GB consumer GPU (GTX 1660 Ti).
#
# MEASURED on that card, end to end:
#   manifest + parquet extraction   1m 20s
#   CTC forced alignment            9m 15s   (22497 spans, 1.7% dropped)
#   span embeddings + discovery     3m 30s   (9 ambiguous word types found)
#   teacher cache                      21s
#   Mimi codec encoding             1m 19s
#   context encoder, 1500 steps     1m 06s   (22.6 steps/s, 80 MB)
#   acoustic model                  ~4.2 s/step at batch 32
#
# The acoustic stage is the slow one: a 1660 Ti has no bf16 and weak fp16
# throughput, so budget roughly 4-5 hours for 4000 steps. That is enough to
# hear whether audio is forming, which is the point of exp0. Use a rented
# Ampere card (or newer) for a run you intend to listen to critically.
#
# A note on precision: torch reports is_bf16_supported() == True on Turing, but
# that is emulation, not hardware. Turing (compute 7.5) has no bf16 tensor
# cores, so bf16 there is slower than fp16 and buys nothing. Hence fp16 with a
# gradient scaler. On Ampere or newer (compute >= 8.0), switch
# train.precision to bf16 and raise train.batch_size.

_base_: base.yaml

name: exp0_small_egyptian

paths:
  root: runs/exp0
  dataset_dir: data/egy_small
  cache_dir: cache/exp0
  hf_dataset_id: OmarAhmedSobhy/tts-egyption-dataset

text:
  # This dataset ships two transcript columns. "text" is the raw ASR output;
  # "cohere_text" is the cleaned one, which is what we want to speak.
  parquet_text_column: cohere_text
  use_egyptian_normalizer: true
  max_chars: 320
  max_words: 72

audio:
  min_duration: 1.0
  max_duration: 15.0

discovery:
  # Measured on this corpus: 6631 word types, 22878 tokens, so only 508 types
  # occur 6+ times and 253 occur 12+. The brief's showcase homographs are rare
  # here (علم appears 10 times, مصر 4), which is a property of a 3-hour corpus,
  # not of the method. Expect exp0 to demonstrate that the machinery finds real
  # acoustic splits on whatever words ARE frequent; the specific homographs
  # from the brief need exp1's 68 hours to have enough occurrences.
  #
  # The frequency floor drops so there is anything to test at all. The three
  # statistical gates below stay strict, so this widens the search without
  # weakening the evidence required to declare a homograph.
  min_word_freq: 6
  min_cluster_frac: 0.15
  max_occurrences_per_word: 400
  n_bootstrap: 16

context_encoder:
  d_model: 192
  n_layers: 3
  n_heads: 4
  d_ff: 512

acoustic:
  # Smaller than exp1: a 2 GB corpus cannot support 56M parameters.
  d_model: 256
  n_layers: 8
  n_heads: 4
  d_ff: 1024
  depth_d_model: 192
  depth_n_layers: 3
  depth_n_heads: 4
  text_d_model: 192
  text_n_layers: 3
  text_n_heads: 4
  exit_layers: [3, 5, 8]
  exit_loss_weights: [0.3, 0.6, 1.0]

optim:
  lr: 3.0e-4
  warmup_steps: 300
  max_steps: 12000

train:
  # fp16 + scaler: the 1660 Ti has no bf16. Keep workers low on Windows, where
  # each worker re-imports torch and spawning is expensive.
  precision: fp16
  # Benchmarked on a 1660 Ti: batch 32 reaches 1102 frames/s against 377 at
  # batch 8, for 4.3 GB of the 6 GB available. Small batches leave the GPU
  # launch-bound rather than compute-bound.
  batch_size: 32
  eval_batch_size: 16
  num_workers: 2
  compile: false          # Triton has no Windows wheel for this torch build
  log_every: 20
  eval_every: 500
  save_every: 1000
  sample_every: 1000
  max_eval_batches: 20
  bucket_boundaries: [32, 64, 96, 128, 160, 200]

inference:
  temperature: 0.7
  cfg_scale: 1.5
